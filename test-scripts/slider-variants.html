<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slider Controls - 10 Variants</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --card: #ffffff;
      --line: #dbe3ef;
      --text: #172b4d;
      --muted: #5b6f8f;
      --brand: #2f86eb;
      --brand-soft: #eaf3ff;
      --ok: #2ea86f;
      --warn: #f08a2b;
      --danger: #d9534f;
      --radius: 14px;
      --shadow: 0 8px 20px rgba(15, 45, 90, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, #e6efff 0%, transparent 38%),
        radial-gradient(circle at top left, #e7f8f1 0%, transparent 32%),
        var(--bg);
      padding: 24px;
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .page-head {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .page-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(360px, 1fr));
    }

    .variant {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      gap: 10px;
      min-height: 360px;
    }

    .variant-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .variant-title span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .slider-shell {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #fcfdff;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 250px;
    }

    .slide-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fbff;
    }

    .slide-version {
      font-weight: 800;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #0e4e95;
      background: var(--brand-soft);
      border: 1px solid #c8ddff;
    }

    .slide-badge {
      font-weight: 700;
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 999px;
      color: #fff;
      background: var(--warn);
    }

    .slide-body {
      padding: 12px 14px;
      overflow: auto;
    }

    .slide-body ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 8px;
      color: #233b61;
      font-size: 13px;
      line-height: 1.35;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      min-height: 54px;
    }

    .btn {
      border: 1px solid #c8d8ee;
      background: #fff;
      color: #29466f;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:hover { border-color: #9cbbe4; background: #f4f9ff; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .nav-btn {
      min-width: 118px;
      text-align: center;
    }

    .variant[data-style="arrows-pills"] .nav-btn {
      border-radius: 999px;
      background: #f3f8ff;
      border-color: #b9d4ff;
      color: #1f5fa8;
    }

    .variant[data-style="segmented"] .nav-btn {
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #f1f6ff 100%);
      border-color: #9fc0ef;
    }

    .variant[data-style="dots"] .nav-btn {
      border-radius: 999px;
      background: #1f3550;
      border-color: #1f3550;
      color: #fff;
    }

    .variant[data-style="vertical-list"] .nav-btn {
      border-radius: 10px;
      background: #f9f4ff;
      border-color: #d5b8ff;
      color: #64309b;
    }

    .variant[data-style="tabs"] .nav-btn {
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-color: #aec4df;
      color: #223d63;
    }

    .variant[data-style="range"] .nav-btn {
      border-radius: 10px;
      background: #f2fff6;
      border-color: #9ed7b0;
      color: #1f7a45;
    }

    .variant[data-style="dropdown"] .nav-btn {
      border-radius: 999px;
      background: #fff8f2;
      border-color: #f3c79d;
      color: #9b4f0d;
    }

    .variant[data-style="mini-cards"] .nav-btn {
      border-radius: 10px;
      border-width: 2px;
      border-color: #99b8df;
      background: #fff;
      color: #244770;
    }

    .variant[data-style="stepper"] .nav-btn {
      border-radius: 999px;
      background: linear-gradient(90deg, #eef7ff 0%, #f3eeff 100%);
      border-color: #c5baf1;
      color: #4e2f85;
    }

    .variant[data-style="text-links"] .nav-btn {
      border: none;
      background: transparent;
      color: #2f86eb;
      text-decoration: underline;
      min-width: unset;
      padding-left: 4px;
      padding-right: 4px;
    }

    .spread {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .controls.showcase {
      display: block;
    }

    .anim-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-height: 190px;
      overflow: auto;
      padding-right: 4px;
    }

    .anim-row {
      display: grid;
      grid-template-columns: 34px 1fr 1fr;
      gap: 6px;
      align-items: center;
    }

    .anim-tag {
      font-size: 11px;
      font-weight: 800;
      color: #5a6f8f;
      text-align: center;
    }

    .anim-btn {
      min-width: 0;
      font-size: 11px;
      padding: 6px 8px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .variant[data-style="arrows-pills"] .showcase .anim-btn {
      border-radius: 999px;
      background: #f3f8ff;
      border-color: #b9d4ff;
      color: #1f5fa8;
    }

    .variant[data-style="stepper"] .showcase .anim-btn {
      border-radius: 999px;
      background: linear-gradient(90deg, #eef7ff 0%, #f3eeff 100%);
      border-color: #c5baf1;
      color: #4e2f85;
    }

    /* A1/B1: same feel as main menu buttons */
    .anim-set-1 .anim-btn {
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }
    .anim-set-1 .anim-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(129, 168, 211, 0.56);
      box-shadow: 0 8px 16px rgba(42, 66, 96, 0.1);
    }

    .anim-set-2 .anim-btn {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .anim-set-2 .anim-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 18px rgba(55, 96, 150, 0.16);
    }

    .anim-set-3 .anim-btn {
      transition: box-shadow 0.2s ease, filter 0.2s ease;
    }
    .anim-set-3 .anim-btn:hover {
      box-shadow: 0 0 0 2px rgba(76, 138, 218, 0.25), 0 8px 18px rgba(76, 138, 218, 0.2);
      filter: saturate(1.1);
    }

    .anim-set-4 .anim-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.8) 50%, transparent 70%);
      transform: translateX(-140%);
      transition: transform 0.4s ease;
      pointer-events: none;
      z-index: 1;
    }
    .anim-set-4 .anim-btn:hover::after {
      transform: translateX(140%);
    }

    .anim-set-5 .anim-btn:hover {
      animation: pulseBorder 0.75s ease-in-out infinite;
    }

    .anim-set-6 .anim-btn {
      transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .anim-set-6 .anim-btn:hover {
      background: #eef5ff;
      border-color: #9cbbe4;
    }
    .anim-set-6 .anim-btn:active {
      transform: scale(0.95);
    }

    .anim-set-7 .anim-btn::before {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 3px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.22s ease;
      opacity: 0.85;
    }
    .anim-set-7 .anim-btn:hover::before {
      transform: scaleX(1);
    }

    .anim-set-8 .anim-btn:hover {
      animation: ringPop 0.45s ease-out;
    }

    .anim-set-9 .anim-btn {
      background-size: 200% 100%;
      background-image: linear-gradient(90deg, #eef5ff, #dfefff, #eef5ff);
      transition: background-position 0.35s ease, transform 0.2s ease;
    }
    .anim-set-9 .anim-btn:hover {
      background-position: 100% 0;
      transform: translateY(-1px);
    }

    .anim-set-10 .anim-btn:hover {
      animation: wobbleX 0.36s ease;
    }

    @keyframes pulseBorder {
      0% { box-shadow: 0 0 0 0 rgba(69, 123, 198, 0.08); }
      50% { box-shadow: 0 0 0 5px rgba(69, 123, 198, 0.16); }
      100% { box-shadow: 0 0 0 0 rgba(69, 123, 198, 0.08); }
    }

    @keyframes ringPop {
      0% { box-shadow: 0 0 0 0 rgba(60, 115, 196, 0.35); }
      100% { box-shadow: 0 0 0 8px rgba(60, 115, 196, 0); }
    }

    @keyframes wobbleX {
      0% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      50% { transform: translateX(2px); }
      75% { transform: translateX(-1px); }
      100% { transform: translateX(0); }
    }

    @media (max-width: 1080px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="page-head">
      <h1>Slider Switcher Playground - 10 Variants</h1>
      <p>Pick one variant. All sliders use identical content, only navigation controls differ.</p>
    </section>

    <section class="grid" id="variants"></section>
  </div>

  <script>
    const slides = [
      {
        version: "v1.5.0",
        badge: "NEW",
        badgeColor: "#2ea86f",
        points: [
          "Added new Assets tab.",
          "Top-10 active symbols by exchange and side.",
          "Assets table with filters and copy mode."
        ]
      },
      {
        version: "v1.4.0",
        badge: "HOT",
        badgeColor: "#f08a2b",
        points: [
          "Improved run control: stop / resume.",
          "Configurator got stronger validation.",
          "Import settings from Veles bot share link."
        ]
      },
      {
        version: "v1.3.0",
        badge: "INFO",
        badgeColor: "#2f86eb",
        points: [
          "Settings page and bug report export.",
          "History page state sync improvements.",
          "More robust queue and retry behavior."
        ]
      },
      {
        version: "v1.2.9",
        badge: "UPD",
        badgeColor: "#64748b",
        points: [
          "Polished navigation and side menu styles.",
          "Connection status block improvements.",
          "Cleaner visual hierarchy on all views."
        ]
      },
      {
        version: "v1.2.8",
        badge: "UPD",
        badgeColor: "#64748b",
        points: [
          "History cards got instant state updates.",
          "Stop/resume actions synced across screens.",
          "Reduced stale lock scenarios."
        ]
      },
      {
        version: "v1.2.7",
        badge: "UPD",
        badgeColor: "#64748b",
        points: [
          "Unified validation source for configurator.",
          "Step badges now reflect real errors.",
          "Improved field-level validation consistency."
        ]
      },
      {
        version: "v1.2.6",
        badge: "UPD",
        badgeColor: "#64748b",
        points: [
          "Exchange list fetched from API.",
          "Symbol input supports suggestions and manual entry.",
          "Compatibility checks added for exchange/symbol."
        ]
      },
      {
        version: "v1.2.5",
        badge: "UPD",
        badgeColor: "#64748b",
        points: [
          "Queue execution became more resilient.",
          "Pause timing fixed after retries.",
          "Improved logs and Russian localization."
        ]
      },
      {
        version: "v1.2.4",
        badge: "UPD",
        badgeColor: "#64748b",
        points: [
          "Templates and history UI refresh.",
          "Card actions aligned with runtime state.",
          "Cleaner controls and status badges."
        ]
      },
      {
        version: "v1.2.3",
        badge: "BASE",
        badgeColor: "#1f8f6d",
        points: [
          "Base release for this demo stack.",
          "Initial slider and release panel introduced.",
          "Foundation for future updates."
        ]
      }
    ];

    const variants = [
      { id: "v01", title: "Variant 1", subtitle: "Rounded pills + 10 button animations", style: "arrows-pills" },
      { id: "v02", title: "Variant 2", subtitle: "Soft segmented", style: "segmented" },
      { id: "v03", title: "Variant 3", subtitle: "Dark contrast", style: "dots" },
      { id: "v04", title: "Variant 4", subtitle: "Purple accent", style: "vertical-list" },
      { id: "v05", title: "Variant 5", subtitle: "Caps tabs", style: "tabs" },
      { id: "v06", title: "Variant 6", subtitle: "Green minimal", style: "range" },
      { id: "v07", title: "Variant 7", subtitle: "Warm orange", style: "dropdown" },
      { id: "v08", title: "Variant 8", subtitle: "Double border", style: "mini-cards" },
      { id: "v09", title: "Variant 9", subtitle: "Gradient soft + 10 button animations", style: "stepper" },
      { id: "v10", title: "Variant 10", subtitle: "Link style", style: "text-links" }
    ];

    const root = document.getElementById("variants");

    function renderCard(variant) {
      const card = document.createElement("article");
      card.className = "variant";
      card.dataset.style = variant.style;
      card.dataset.index = "0";

      card.innerHTML = `
        <h3 class="variant-title">
          <strong>${variant.title}</strong>
          <span>${variant.subtitle}</span>
        </h3>
        <div class="slider-shell">
          <div class="slide-head">
            <span class="slide-version"></span>
            <span class="slide-badge"></span>
          </div>
          <div class="slide-body"></div>
        </div>
        <div class="controls"></div>
      `;

      root.appendChild(card);
      mount(card);
    }

    function setSlide(card, index) {
      const total = slides.length;
      const next = ((index % total) + total) % total;
      card.dataset.index = String(next);

      const data = slides[next];
      card.querySelector(".slide-version").textContent = data.version;
      const badge = card.querySelector(".slide-badge");
      badge.textContent = data.badge;
      badge.style.background = data.badgeColor;

      const body = card.querySelector(".slide-body");
      body.innerHTML = `<ul>${data.points.map(p => `<li>${p}</li>`).join("")}</ul>`;
    }

    function go(card, idx) {
      setSlide(card, idx);
    }

    function buildAnimationRows(prefix) {
      return Array.from({ length: 10 }, (_, i) => {
        const setNo = i + 1;
        return `
          <div class="anim-row anim-set-${setNo}">
            <span class="anim-tag">${prefix}${setNo}</span>
            <button class="btn nav-btn anim-btn" data-prev>&larr; Prev</button>
            <button class="btn nav-btn anim-btn" data-next>Next &rarr;</button>
          </div>
        `;
      }).join("");
    }

    function mount(card) {
      const controls = card.querySelector(".controls");
      const style = card.dataset.style;

      if (style === "arrows-pills" || style === "stepper") {
        const prefix = style === "arrows-pills" ? "A" : "B";
        controls.classList.add("showcase");
        controls.innerHTML = `<div class="anim-grid">${buildAnimationRows(prefix)}</div>`;
      } else {
        controls.classList.add("spread");
        controls.innerHTML = `
          <button class="btn nav-btn" data-prev>&larr; Prev</button>
          <button class="btn nav-btn" data-next>Next &rarr;</button>
        `;
      }

      controls.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-prev], [data-next]");
        if (!btn) return;
        const idx = Number(card.dataset.index);
        if (btn.hasAttribute("data-prev")) return go(card, idx - 1);
        if (btn.hasAttribute("data-next")) return go(card, idx + 1);
      });

      setSlide(card, 0);
    }

    variants.forEach(renderCard);
  </script>
</body>
</html>
