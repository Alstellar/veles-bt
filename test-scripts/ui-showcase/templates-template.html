<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Templates Template</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="page">
  <section class="topbar"><div><h1>Шаблоны</h1><p>Список сохраненных конфигураций</p></div><div class="controls"><button class="btn btn-soft">Создать</button></div></section>
  <section class="layout single">
    <article class="card"><div class="card-head"><h2 class="card-title">HYPE Long Aggressive</h2><span class="status status-done">DONE</span></div><div class="card-body controls"><button class="btn btn-primary">Применить</button><button class="btn">Редактировать</button><button class="btn btn-danger">Удалить</button></div></article>
    <article class="card"><div class="card-head"><h2 class="card-title">BTC Short Conservative</h2><span class="status status-stop">STOP</span></div><div class="card-body controls"><button class="btn btn-primary">Применить</button><button class="btn">Редактировать</button><button class="btn btn-danger">Удалить</button></div></article>
    <article class="card"><div class="card-body"><div class="empty">Пустое состояние: нет сохраненных шаблонов</div></div></article>
  </section>
</main></body></html>
