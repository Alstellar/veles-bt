<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard Template</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="page">
  <section class="topbar"><div><h1>Главная</h1><p>Сводка по тестам и быстрые действия</p></div><div class="controls"><button class="btn btn-soft">Синхронизировать</button><button class="btn">Открыть историю</button></div></section>
  <section class="layout single">
    <div class="grid3">
      <article class="card"><div class="card-body"><div class="kv"><div class="k">Всего запусков</div><div class="v">128</div></div></div></article>
      <article class="card"><div class="card-body"><div class="kv"><div class="k">Активные</div><div class="v">2</div></div></div></article>
      <article class="card"><div class="card-body"><div class="kv"><div class="k">Успешные</div><div class="v">94</div></div></div></article>
    </div>
    <article class="card"><div class="card-head"><h2 class="card-title">Последние запуски</h2></div><div class="card-body">
      <table class="table"><thead><tr><th>ID</th><th>Монета</th><th>Прогресс</th><th>Статус</th></tr></thead><tbody>
        <tr><td>#71300</td><td>HYPE/USDT</td><td>12/34</td><td><span class="status status-run">RUN</span></td></tr>
        <tr><td>#71301</td><td>BTC/USDT</td><td>34/34</td><td><span class="status status-done">DONE</span></td></tr>
        <tr><td>#71302</td><td>ETH/USDT</td><td>7/20</td><td><span class="status status-stop">STOP</span></td></tr>
      </tbody></table>
    </div></article>
  </section>
</main></body></html>
