<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configurator Template</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="page">
  <section class="topbar"><div><h1>Конфигуратор</h1><p>Тестовый стиль блоков и шагов</p></div><div class="controls"><button class="btn">Импорт</button><button class="btn btn-soft">Сохранить шаблон</button></div></section>
  <section class="layout">
    <section>
      <article class="card"><div class="card-head"><h2 class="card-title">Базовые настройки</h2></div><div class="card-body grid2">
        <div class="kv"><div class="k">Биржа</div><div class="v">BINANCE_FUTURES</div></div>
        <div class="kv"><div class="k">Тикер</div><div class="v">HYPE/USDT</div></div>
        <div class="kv"><div class="k">Алгоритм</div><div class="v">LONG</div></div>
        <div class="kv"><div class="k">Период</div><div class="v">365 д</div></div>
      </div></article>
      <article class="card"><div class="card-head"><h2 class="card-title">Условия открытия сделки</h2></div><div class="card-body"><div class="empty">Демо-блок условий и индикаторов</div></div></article>
      <article class="card"><div class="card-head"><h2 class="card-title">Запуск бектестов</h2></div><div class="card-body controls"><button class="btn btn-soft">Валидация данных</button><button class="btn btn-success">Запустить бектесты</button></div></article>
    </section>
    <aside class="card"><div class="card-head"><h2 class="card-title">Шаги</h2></div><div class="card-body step-list">
      <button class="step active">Базовые настройки</button>
      <button class="step">Условия открытия сделки</button>
      <button class="step">Ордера сделки</button>
      <button class="step warn">Выход из сделки</button>
      <button class="step warn">Запуск бектестов</button>
    </div></aside>
  </section>
</main></body></html>
