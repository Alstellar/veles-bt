<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>History Template</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="page">
  <section class="topbar"><div><h1>История запусков</h1><p>Статусы обновлены: RUN желтый, DONE зеленый, STOP красный</p></div><div class="controls"><button class="btn btn-soft">Синхронизировать</button><button class="btn btn-danger">Очистить всё</button></div></section>
  <section class="layout single">
    <article class="card"><div class="card-head"><h2 class="card-title">TEST LTC (#4A046)</h2><span class="status status-run">RUN</span></div><div class="card-body">
      <table class="table"><tbody>
        <tr><td>Биржа</td><td>BINANCE_FUTURES</td></tr>
        <tr><td>Монета</td><td>LTC/USDT</td></tr>
        <tr><td>Прогресс</td><td>12 / 34</td></tr>
      </tbody></table>
      <div class="controls" style="margin-top:10px"><button class="btn btn-danger">Остановить</button><button class="btn">Результаты</button></div>
    </div></article>
    <article class="card"><div class="card-head"><h2 class="card-title">TEST BTC (#686CA)</h2><span class="status status-stop">STOP</span></div><div class="card-body controls"><button class="btn btn-success">Продолжить</button><button class="btn">Результаты</button></div></article>
    <article class="card"><div class="card-head"><h2 class="card-title">TEST ETH (#71301)</h2><span class="status status-done">DONE</span></div><div class="card-body controls"><button class="btn">Результаты</button></div></article>
  </section>
</main></body></html>
